name: hoomy
description: A family home needs reminder app with alerts, chat, calendar, and shortcuts.
publish_to: "none"
version: 0.1.4+2006

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.0.10+1
  geolocator: ^12.0.0
  http: ^1.2.2
  intl: ^0.20.2
  socket_io_client: ^2.0.3+1
  shared_preferences: ^2.3.3
  url_launcher: ^6.3.0
  flutter_local_notifications: ^22.0.1
  firebase_core: 3.15.2
  firebase_messaging: 15.2.10
  mobile_scanner: ^6.0.2
  qr_flutter: ^4.1.0
  timezone: ^0.11.1
  record: ^5.2.0
  path_provider: ^2.1.5
  audioplayers: ^6.1.0
  image_picker: ^1.1.2
  firebase_analytics: ^11.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  record_platform_interface: 1.2.0

flutter:
  uses-material-design: true
  assets:
    - assets/illustrations/
